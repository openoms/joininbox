name: Test bats

concurrency:
  group: test-bats-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  bats:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.11.0 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo ln -sf /tmp/bats-core/bin/bats /usr/local/bin/bats
          bats --version

      # Run the retained hardening suite and the JoinMarket NG suite.
      - name: Run the bats test suite
        run: |
          bats -r tests
          bats test/bats
